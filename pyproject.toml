[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon"
version = "0.1.0"
description = "Three-way settlement reconciliation agent (Razorpay AI Buildathon, Track 04)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Vansh S" }]
keywords = ["reconciliation", "settlements", "fintech", "payments", "razorpay"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]

# The deterministic core has NO third-party dependencies. `anthropic` is needed
# only for the optional agent layer; the whole pipeline runs without it.
dependencies = []

[project.urls]
Homepage = "https://github.com/VanshS-21/Razorpay-Submission"
Source = "https://github.com/VanshS-21/Razorpay-Submission"
Issues = "https://github.com/VanshS-21/Razorpay-Submission/issues"

[project.scripts]
recon = "recon.cli:main"

[project.optional-dependencies]
# The output_config={"format": ...} shape this code uses needs a recent
# SDK. A resolver landing on 0.40 raises TypeError, which the backend
# swallows into an error count -- a dependency problem wearing the
# costume of a model failure.
agent = ["anthropic>=0.69"]
# Either vendor satisfies the agent layer; neither is needed for the
# deterministic engine, which is the product.
gemini = ["google-genai>=2.0"]
# Claude served by AWS: same Messages API, SigV4 instead of an API key.
bedrock = ["anthropic[bedrock]>=0.69"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Project-local temp dir: the system temp path is not always writable on
# Windows, and the suite should not depend on the machine it runs on.
addopts = "--basetemp=.pytest-tmp"
